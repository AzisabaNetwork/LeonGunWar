# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]
# plugin
shadow = "9.1.0"
runPaper = "3.0.0"
lombok = "8.14.2"
download = "5.6.0"

# library
paperApi = "1.16.5-R0.1-SNAPSHOT"
configLib = "4.6.1"
caffeine = "3.2.2"
kdStatusReloaded = "2.2.0"
playerSettings = "1.0.0"
slimeworldmanagerApi = "2.2.1"
crackshot = "0.98.11"
worldeditCore = "7.2.17"
worldguardBukkit = "7.0.5"
hikaricp = "4.0.3"
placeholderApi = "2.11.6"
jsonMessage = "1.3.1"
nameChangeAutomation = "2.0.1"
essentialsx = "2.19.2"
luckpermsApi = "5.4"
mysqlConnectorJ = "9.4.0"
jdbi = "3.49.5"
jspecify = "1.0.0"
junit = "5.13.4"

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
runPaper = { id = "xyz.jpenilla.run-paper", version.ref = "runPaper" }
lombok = { id = "io.freefair.lombok", version.ref = "lombok" }
download = { id = "de.undercouch.download", version.ref = "download" }

[libraries]
# system
paperApi = { module = "com.destroystokyo.paper:paper-api", version.ref = "paperApi" }

# config
configLib = { module = "de.exlll:configlib-yaml", version.ref = "configLib" }

# cache
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }

# database
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
mysqlConnectorJ = { module = "com.mysql:mysql-connector-j", version.ref = "mysqlConnectorJ" }
jdbiCore = { module = "org.jdbi:jdbi3-core", version.ref = "jdbi" }
jdbiSqlobject = { module = "org.jdbi:jdbi3-sqlobject", version.ref = "jdbi" }


# util
jsonMessage = { module = "me.rayzr522:jsonmessage", version.ref = "jsonMessage" }

# plugin
kdStatusReloaded = { module = "com.github.AzisabaNetwork:KDStatusReloaded", version.ref = "kdStatusReloaded" }
playerSettings = { module = "com.github.AzisabaNetwork:PlayerSettings", version.ref = "playerSettings" }
slimeworldmanagerApi = { module = "com.grinderwolf:slimeworldmanager-api", version.ref = "slimeworldmanagerApi" }
crackshot = { module = "com.shampaggon:CrackShot", version.ref = "crackshot" }
worldeditCore = { module = "com.sk89q.worldedit:worldedit-core", version.ref = "worldeditCore" }
worldguardBukkit = { module = "com.sk89q.worldguard:worldguard-bukkit", version.ref = "worldguardBukkit" }
placeholderApi = { module = "me.clip:placeholderapi", version.ref = "placeholderApi" }
nameChangeAutomation = { module = "net.azisaba:NameChangeAutomation", version.ref = "nameChangeAutomation" }
essentialsx = { module = "net.essentialsx:EssentialsX", version.ref = "essentialsx" }
luckpermsApi = { module = "net.luckperms:api", version.ref = "luckpermsApi" }

# check
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junitBom = { module = "org.junit:junit-bom", version.ref = "junit" }
junitJupiter = { module = "org.junit.jupiter:junit-jupiter" }
junitPlatformLauncher = { module = "org.junit.platform:junit-platform-launcher" }

[bundles]
jdbi = [
    "jdbiCore",
    "jdbiSqlobject"
]
