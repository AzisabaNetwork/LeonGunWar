[versions]
# plugin
shadow = "9.1.0"
runPaper = "3.0.0"
lombok = "8.14.2"

# library
paperApi = "1.21.11-R0.1-SNAPSHOT"
configLib = "4.6.1"
caffeine = "3.2.2"
kdStatusReloaded = "2.4.1"
slimeworldmanagerApi = "2.2.1"
crackshot = "1.0.1"
worldeditCore = "7.4.2"
worldguardBukkit = "7.0.16"
hikaricp = "4.0.3"
placeholderApi = "2.12.3"
essentialsx = "2.21.2"
luckpermsApi = "5.5"
mysqlConnectorJ = "9.4.0"
jspecify = "1.0.0"
junit = "5.13.4"

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
runPaper = { id = "xyz.jpenilla.run-paper", version.ref = "runPaper" }
lombok = { id = "io.freefair.lombok", version.ref = "lombok" }

[libraries]
# system
paperApi = { module = "io.papermc.paper:paper-api", version.ref = "paperApi" }

# config
configLib = { module = "de.exlll:configlib-yaml", version.ref = "configLib" }

# cache
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }

# database
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
mysqlConnectorJ = { module = "com.mysql:mysql-connector-j", version.ref = "mysqlConnectorJ" }

# plugin
kdStatusReloaded = { module = "com.github.AzisabaNetwork:KDStatusReloaded", version.ref = "kdStatusReloaded" }
slimeworldmanagerApi = { module = "com.grinderwolf:slimeworldmanager-api", version.ref = "slimeworldmanagerApi" }
worldeditCore = { module = "com.sk89q.worldedit:worldedit-core", version.ref = "worldeditCore" }
worldguardBukkit = { module = "com.sk89q.worldguard:worldguard-bukkit", version.ref = "worldguardBukkit" }
placeholderApi = { module = "me.clip:placeholderapi", version.ref = "placeholderApi" }
essentialsx = { module = "net.essentialsx:EssentialsX", version.ref = "essentialsx" }
luckpermsApi = { module = "net.luckperms:api", version.ref = "luckpermsApi" }

# check
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junitBom = { module = "org.junit:junit-bom", version.ref = "junit" }
junitJupiter = { module = "org.junit.jupiter:junit-jupiter" }
junitPlatformLauncher = { module = "org.junit.platform:junit-platform-launcher" }
