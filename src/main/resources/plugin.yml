name: ${name}
main: net.azisaba.lgw.core.LeonGunWar
version: ${version}
authors: ["siloneco", "YukiLeafX", "matsu1213", "Arisa9006", "sysnote8main"]
description: ${description}
website: ${websiteUrl}
load: POSTWORLD
depend: ["CrackShot", "Essentials", "WorldGuard", "KDStatusReloaded", "LuckPerms"]
softdepend: ["Multiverse-Core", "PlaceholderAPI", "EssentialsSpawn", "RyuZUPluginChat"]
api-version: '1.21.11'
commands:
  leongunwaradmin:
    description: Nothing
    permission: leongunwar.command.leongunwaradmin
    aliases: ["lgwadmin"]
  uav:
    usage: /uav [Player]
    description: Nothing
    permission: leongunwar.command.uav
  #match:
  #  usage: /match <entry/rejoin/leave> (player)
  #  permission: leongunwar.command.match
  mapvote:
    usage: /mapvote <index>
    permission: leongunwar.command.mapvote
    aliases: ["votemap"]
  kiai:
    usage: /kiai
    permission: leongunwar.command.kiai
  resourcepack:
    usage: /resourcepack
    aliases: ["pack", "texture"]
    permission: leongunwar.command.resourcepack
  adminchat:
    usage: /adminchat <msg>
    aliases: ["c"]
    permission: leongunwar.adminchat.send
  limit:
    usage: /limit [drop/build]
    permission: leongunwar.command.limit
  toggle:
    usage: /toggle sign
    permission: leongunwar.command.leongunwaradmin
  lsyogo:
    usage: /lsyogo [gui | select <ID> | remove [player] | give/revoke <player|UUID> <ID> | ticket <player> <ID> [1-64] | bind <ID> | check <player|UUID> | reload]
    permission: leongunwar.command.syogo
  spawn:
    aliases: ["lobby", "hub"]
  noticewar:
    usage: /noticewar
    permission: leongunwar.adminchat.send
  toggledoublereward:
    usage: /toggledoublereward
    permission: leongunwar.command.leongunwaradmin
  killaction:
    usage: /killaction [ticket <player> <sound|log|particle> <ID> [1-64] | bind <sound|log|particle> <ID>]
    description: ロビーでキル演出を選択、試合鯖では現在の設定を確認
    permission: leongunwar.command.killaction
permissions:
  leongunwar.entrysign.changestate:
    default: op
  leongunwar.command.leongunwaradmin:
    default: op
  leongunwar.afkkick.exempt:
    default: op
  leongunwar.command.uav:
    default: op
  #leongunwar.command.match:
  #  default: true
  leongunwar.command.mapvote:
    default: true
  leongunwar.command.match.other:
    default: op
  leongunwar.command.kiai:
    default: true
  leongunwar.command.resourcepack:
    default: true
  leongunwar.adminchat.send:
    default: op
  leongunwar.adminchat.receive:
    default: op
  leongunwar.command.limit:
    default: op
  leongunwar.command.syogo:
    default: true
  leongunwar.syogo.add:
    default: op
  leongunwar.syogo.give:
    default: op
  leongunwar.syogo.remove:
    default: true
  leongunwar.syogo.remove-admin:
    default: op
  leongunwar.syogo.check:
    default: op
  leongunwar.syogo.item:
    default: op
  leongunwar.syogo.revoke:
    default: op
  leongunwar.syogo.reload:
    default: op
  leongunwar.syogo.delete:
    default: op
  leongunwar.killlog.event:
    default: false
  leongunwar.killlog.supporter:
    default: false
  leongunwar.command.killaction:
    default: true
  leongunwar.killaction.item:
    default: op
